name: Artifacts upload pipline

on: 
  pull_request: 
    branches:
      - main
    


jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Create app file
      run:  echo "This is te test code" > app.js

    - name: upload the artifacts
      uses: actions/upload-artifact@v4
      with:
        name: application-artifact
        path:  app.js
  deployment:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Download the artifacts
        uses: actions/download-artifact@v4
        with:
           name: application-artifact

          
      - name: Test the downlaod
        run: cat app.js
        

    
     
